<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天気アドバイザー</title>
  <link rel="stylesheet" href="style.css" />

  <!-- ✅ PWA対応追加 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
</head>
<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="天気アイコン" class="logo" />
    <h1>天気アドバイザー</h1>
    <p class="subtext">現在地の天気から傘と服装のアドバイスを表示します</p>
    <button onclick="getAdvice()">アドバイスを表示</button>
    <div id="result" class="result-box"></div>
  </div>

  <script src="app.js"></script>

  <!-- ✅ Service Worker 登録用スクリプト追加 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("SW 登録成功"))
        .catch(err => console.log("SW 登録失敗:", err));
    }
  </script>
</body>
</html>
